services:
  - type: web
    name: hybridpro-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Hybrid Pro <noreply@hybridpro.in>"
      - key: GOOGLE_CLIENT_IDS
        sync: false